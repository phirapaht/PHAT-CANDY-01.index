<style>
:root{--ink:#4a2670;--pk:#ff5ea8;--pu:#7955df;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--ink);font:800 15px Sarabun,"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 12% 10%,#fff6b8 0 4%,transparent 20%),radial-gradient(circle at 90% 18%,#c9fbff 0 5%,transparent 22%),linear-gradient(160deg,#9fd8ff,#e8c6ff 50%,#ffc2e0) fixed;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.3;background:radial-gradient(#fff 2px,transparent 2px) 0 0/30px 30px}
[hidden]{display:none!important}
button{font:inherit;border:0;cursor:pointer;color:inherit;transition:transform .12s,filter .12s}button:hover{filter:brightness(1.06)}button:active{transform:translateY(2px)}button:focus-visible{outline:3px solid #5536b9;outline-offset:2px}
#scene{position:fixed;inset:0;z-index:-2}#scene svg{width:100%;height:100%;display:block}.stars{display:flex;justify-content:center;gap:6px;margin:8px 0}.stars b{font-size:78px;line-height:1;color:#d8c6ec;text-shadow:0 4px 0 #fff;scale:.7;opacity:.55}.stars b.on{color:#ffc928;text-shadow:0 5px 0 #b87900,0 0 18px #ffe27a;animation:starIn .6s both}.rs{display:inline-block;background:linear-gradient(#5fb8ff,#2b7be6);color:#fff;font:500 36px Mitr,sans-serif;padding:4px 30px;border-radius:8px;margin:6px 0 10px}@keyframes starIn{from{scale:0;rotate:-90deg;opacity:0}to{scale:1.1;opacity:1}}.card{background:linear-gradient(#fff0f8f2,#ffd9ecf2)!important}.modal .primary{font-size:19px}.awning{height:26px;background:repeating-linear-gradient(90deg,#ff6fa3 0 56px,#fff 56px 112px);border-bottom:5px solid #d94a85;border-radius:0 0 22px 22px;box-shadow:0 8px 16px #6b2d9a30}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.card{background:#ffffffd6;border:2px solid #fff;border-radius:26px;box-shadow:0 16px 40px #70449c2e;padding:16px}

.st3{border-radius:16px;padding:6px 10px;text-align:center;color:#fff;background:linear-gradient(#ff7cc0,#e83f92);box-shadow:0 4px 0 #a92d6c,inset 0 2px #fff6}.st3 small{display:block;font-size:11px;opacity:.9}.st3 b{font-size:clamp(20px,4vw,28px);line-height:1.1}
.bar{position:relative;height:14px;margin:12px 12px 16px;border-radius:99px;background:#e6d6f6;box-shadow:inset 0 2px 3px #0002}.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff72b4,#a56bff,#6ee6c7);transition:width .4s}
.bar b{position:absolute;top:50%;translate:-50% -50%;font-size:24px;color:#cdbbe3;text-shadow:0 2px #fff;transition:.3s}.bar b.on{color:#ffc928;scale:1.25;text-shadow:0 2px #b87900}
.boardwrap{width:min(100%,max(300px,calc(100dvh - 330px)),640px);margin:auto;padding:9px;border-radius:24px;background:linear-gradient(160deg,#7c9cf0,#4a5cc2);box-shadow:inset 0 3px #fff7,0 8px 0 #36439a,0 18px 30px #2a2f8a40}
#board{position:relative;aspect-ratio:1;container-type:inline-size;touch-action:none;user-select:none;border-radius:14px;overflow:hidden}
#cells,#iceL{position:absolute;inset:0;display:grid;grid:repeat(8,1fr)/repeat(8,1fr);pointer-events:none}#candies,#fx{position:absolute;inset:0;pointer-events:none}#iceL{z-index:2}#fx{z-index:3}
.cell.a{background:#ffffff1f}.cell.b{background:#ffffff38}.cell.jelly{background:radial-gradient(#ffb3de,#ff69b8);box-shadow:inset 0 0 0 .5cqw #fffa}
#iceL .ice{background:linear-gradient(135deg,#e8fbffb0,#9edcff80);box-shadow:inset 0 0 0 .6cqw #fff,inset 0 0 3cqw #fff;border-radius:1cqw}
.candy{position:absolute;left:0;top:0;width:12.5%;height:12.5%;display:grid;place-items:center;transition:transform .26s cubic-bezier(.4,.1,.5,1);will-change:transform}
.k{position:relative;width:80%;height:80%;box-shadow:inset 0 -1.2cqw 1.6cqw #0003,inset 0 .9cqw 1.2cqw #fff9,0 .6cqw .9cqw #0003;transition:scale .15s}
.k:before{content:"";position:absolute;left:18%;top:12%;width:30%;height:15%;border-radius:50%;background:#fffb;rotate:-30deg}
.red .k{width:90%;height:50%;border-radius:50%;rotate:-38deg;background:linear-gradient(#ff8fae,#e5214f)}
.blue .k{border-radius:50%;background:repeating-conic-gradient(#63c0ff 0 22deg,#2b7be6 22deg 44deg)}
.green .k{border-radius:24%;background:linear-gradient(#86f5a8,#0fa356)}
.yellow .k{border-radius:50% 50% 50% 50%/66% 66% 34% 34%;background:linear-gradient(#fff39c,#ffb312)}
.purple .k{border-radius:44%;background:radial-gradient(#ecd0ff 14%,transparent 15%) 0 0/26% 26%,linear-gradient(#c88fff,#8638df)}
.orange .k{width:68%;height:88%;border-radius:50%;background:linear-gradient(#ffc680,#ff761c)}
.sp-h .k:after,.sp-v .k:after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(0deg,#fffd 0 11%,#fff0 11% 24%)}.sp-v .k:after{background:repeating-linear-gradient(90deg,#fffd 0 11%,#fff0 11% 24%)}
.sp-wrap .k{outline:.9cqw solid #fff;outline-offset:-.3cqw;animation:glow .7s infinite alternate}
.rainbow .k{border-radius:50%;width:84%;height:84%;rotate:0deg;background:conic-gradient(#ff3d7f,#ffcf3a,#4fe3a0,#40b4ff,#a46bff,#ff3d7f);animation:glow .7s infinite alternate}
.rainbow .k:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(#fff 6%,transparent 7%) 0 0/20% 20%}
.sel .k{scale:1.18}.pop .k{scale:1.7;opacity:0;transition:scale .24s,opacity .24s}.born .k{animation:born .4s}.hint .k{animation:hint .45s infinite alternate}.pop{z-index:2}
@keyframes glow{to{filter:drop-shadow(0 0 1.6cqw #ffe27a) brightness(1.15)}}@keyframes born{from{scale:1.9}}@keyframes hint{to{scale:1.22}}@keyframes rise{from{opacity:1}to{opacity:0;translate:0 -9cqw}}@keyframes ban{0%{opacity:0;scale:.5}20%{opacity:1;scale:1.1}75%{opacity:1;scale:1}100%{opacity:0;scale:1}}@keyframes shake{25%{translate:-5px 0}75%{translate:5px 0}}
.pt{position:absolute;translate:-50% -50%;font-size:5cqw;color:#fff;text-shadow:0 .5cqw 0 #c0357f,0 0 1.4cqw #0008;animation:rise .9s forwards;white-space:nowrap}
.ban{position:absolute;left:50%;top:42%;translate:-50% -50%;padding:1.5cqw 5cqw;border-radius:5cqw;font:500 7cqw Mitr,sans-serif;color:#7138a4;background:linear-gradient(135deg,#fff2a8,#ff8fc9);box-shadow:0 1cqw 4cqw #55228a60;animation:ban 1s forwards;white-space:nowrap}
.tools{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:16px}
.tool{border-radius:15px;padding:10px 14px;color:#fff;background:linear-gradient(#ae84f5,#7650d4);box-shadow:0 4px 0 #5734a3}.tool.alt{background:linear-gradient(#ff9ac9,#ed5599);box-shadow:0 4px 0 #b33a76}.tool.ok{background:linear-gradient(#5fe3b2,#18a874);box-shadow:0 4px 0 #0d7a52;animation:hint .6s infinite alternate}.tool.on{outline:3px solid #ffd54a}
.tip{text-align:center;font-size:12px;color:#8a72a4;margin-top:12px;font-weight:600}
.side{display:grid;gap:14px}.sh{font:500 17px Mitr,sans-serif;margin-bottom:10px}.gi{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:14px;background:#fff9;margin-bottom:7px}.gi b{flex:1;font-size:13px}.gi strong{font-size:15px}.gi span{font-size:20px}
.pbtn{width:100%;padding:11px;border-radius:14px;background:#fff;color:#7753bd;box-shadow:inset 0 -3px #eadcf8;margin-top:6px}
.overlay{position:fixed;inset:0;background:#40265dc4;backdrop-filter:blur(6px);display:none;place-items:center;padding:16px;z-index:20}.overlay.show{display:grid}
.modal{width:min(500px,100%);max-height:92vh;overflow:auto;background:linear-gradient(145deg,#fff8ff,#f1e5ff);border:3px solid #fff;border-radius:28px;padding:22px;text-align:center;box-shadow:0 25px 80px #26133b70}.big{font-size:54px}.modal h2{font:500 26px Mitr,sans-serif;margin:4px 0}.modal p{color:#7d6896;line-height:1.55;margin:6px 0}
.acts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px}.primary{background:linear-gradient(#ff83ba,#e74794);color:#fff;padding:12px 18px;border-radius:15px;box-shadow:0 4px 0 #ad3670}.secondary{background:#fff;color:#7752b7;padding:12px 18px;border-radius:15px;box-shadow:inset 0 -3px #e5d4f7}
.qq{text-align:left;background:#fff;border-radius:16px;padding:14px;font-size:18px;line-height:1.5;margin-top:12px}.qc{display:grid;gap:8px;margin-top:12px}.qc button{text-align:left;padding:12px;width:100%}.right{background:#d9ffe9!important}.wrong{background:#ffe0eb!important}
.mg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px}.wt{font:500 15px Mitr,sans-serif;text-align:left;margin-top:14px}.mg button{aspect-ratio:1;border-radius:9px;background:#eadcf8;color:#9078b4;font-size:11px;line-height:1.1;padding:0}.mg button.open{color:#7445a1}.mg button.open{background:linear-gradient(#ffe58a,#ffb85e);color:#7445a1}.mg button.cur{outline:3px solid var(--pk)}.mg button:disabled{opacity:.5;cursor:not-allowed}
.toast{position:fixed;left:50%;top:14px;translate:-50% -140%;background:#442b68;color:#fff;padding:11px 18px;border-radius:15px;z-index:40;transition:translate .25s;max-width:90vw;text-align:center}.toast.show{translate:-50% 0}
@media(max-width:860px){.layout{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}}@media(max-width:520px){.side{grid-template-columns:1fr}.card{padding:12px;border-radius:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),W=8,H=8,wait=ms=>new Promise(r=>setTimeout(r,ms)),rnd=n=>Math.floor(Math.random()*n),ok=(r,c)=>r>=0&&r<H&&c>=0&&c<W,cnt=a=>a.flat().filter(Boolean).length;
const COL=['red','blue','green','yellow','purple','orange'];

function findAll(sw=[]){const cells=new Set(),sp=new Map(),hit=Array.from({length:H},()=>Array(W).fill(0)),runs=[];

 for(let c=0;c<W;c++)for(let r=0;r<H;){const a=g[r][c];let e=r+1;if(a&&a.color!=='rainbow')while(e<H&&g[e][c]&&g[e][c].color===a.color)e++;if(e-r>=3){const L=[];for(let k=r;k<e;k++){L.push([k,c]);cells.add(k+','+c);hit[k][c]|=2}runs.push({L,h:0})}r=e}

function modal(emoji,title,msg,btns){const m=$('modal');m.innerHTML='';const add=(t,c,x)=>{const e=document.createElement(t);e.className=c;e.textContent=x;m.appendChild(e);return e};add('div','big',emoji);add('h2','',title);if(msg)add('p','',msg);const a=add('div','acts','');btns.forEach(([t,k,f])=>{const b=document.createElement('button');b.className=k;b.textContent=t;b.onclick=f;a.appendChild(b)});$('overlay').classList.add('show');return m}
function win(){sfx('win');const t=cfg.target,st=score>=t*1.7?3:score>=t*1.3?2:1;firstClear=!S.stars[level];S.stars[level]=Math.max(S.stars[level]||0,st);S.unlocked=Math.max(S.unlocked,Math.min(100,level+1));save();ui();const m=modal('🎉','ผ่านด่าน '+level+'!','',[]),s=document.createElement('div'),sc=document.createElement('div'),ac=m.querySelector('.acts'),f=()=>quiz(st);s.className='stars';for(let i=0;i<3;i++){const b=document.createElement('b');b.textContent='★';if(i<st){b.className='on';b.style.animationDelay=i*.45+'s'}s.appendChild(b)}sc.className='rs';sc.textContent=score.toLocaleString();m.insertBefore(s,ac);m.insertBefore(sc,ac);ac.remove();back=f;setTimeout(()=>{if(back===f&&$('modal').querySelector('.stars'))f()},2800)}
function nextLevel(){level>=100?modal('🏆','พิชิต PHAT CANDY!','ผ่านครบ 100 ด่านแล้ว พร้อมความรู้ HTML, CSS และ JavaScript!',[['เล่นใหม่ตั้งแต่ด่าน 1','primary',()=>start(1)],['ปิด','secondary',closeM]]):start(level+1)}
function quiz(st){const q=QZ[(level-1)%QZ.length],opts=q[2].map((t,i)=>[t,i===0]).sort(()=>Math.random()-.5);
 const m=modal('📚','ผ่านด่านแล้ว! '+'⭐'.repeat(st),`ตอบคำถาม ${q[0]} เพื่อรับเหรียญความรู้ 🪙`,[['ข้ามคำถาม','secondary',nextLevel]]);const acts=m.querySelector('.acts');
 const qq=document.createElement('div');qq.className='qq';qq.textContent=q[1];const qc=document.createElement('div');qc.className='qc';
 opts.forEach(([t,right],i)=>{const b=document.createElement('button');b.className='secondary';b.textContent=String.fromCharCode(65+i)+'. '+t;b.onclick=()=>{if(qc.dataset.done)return;qc.dataset.done=1;b.classList.add(right?'right':'wrong');[...qc.children].forEach((x,j)=>{x.disabled=true;if(opts[j][1])x.classList.add('right')});if(right&&firstClear&&!qdone){S.coins=(S.coins||0)+25;save();ui();toast('ได้รับ 25 เหรียญความรู้! 🪙');sfx('win')}else if(right)sfx('win');else sfx('bad');qdone=1;acts.innerHTML='';const n=document.createElement('button');n.className='primary';n.textContent=level>=100?'จบเกม 🎉':'ไปด่านถัดไป ▶';n.onclick=nextLevel;acts.appendChild(n)};qc.appendChild(b)});
 m.insertBefore(qq,acts);m.insertBefore(qc,acts)}
function lose(){sfx('lose');save();back=lose;const left=cnt(jl)+cnt(ic),b=[['เล่นอีกครั้ง','primary',()=>start(level)],['🗺️ แผนที่','secondary',showMap]];if((S.coins||0)>=60)b.unshift(['🪙 +5 ครั้ง (60 เหรียญ)','primary',()=>{S.coins-=60;moves+=5;back=null;closeM();busy=false;ui();save();idle()}]);
 modal('💫','หมดจำนวนครั้งแล้ว!','ภารกิจ: '+goalText()+' — คะแนน '+score.toLocaleString()+(left?' · เหลือเยลลี่/น้ำแข็ง '+left+' จุด':'')+(cfg.col?' · เก็บได้ '+Math.min(got,cfg.need)+'/'+cfg.need:''),b)}
function showMap(){if(busy&&!back)return;clearTimeout(hT);const m=modal('🗺️','แผนที่อาณาจักร','เลือกด่านที่ปลดล็อกแล้ว (ผ่านแล้ว '+Math.min(100,Object.keys(S.stars).length)+'/100)',[['ปิด','secondary',()=>back?back():(closeM(),idle())]]),ac=m.querySelector('.acts');
 for(let w=0;w<10;w++){const h=document.createElement('div'),gr=document.createElement('div');h.className='wt';h.textContent='โลก '+(w+1)+' · '+WORLDS[w];gr.className='mg';for(let i=w*10+1;i<=w*10+10;i++){const b=document.createElement('button');b.className=(i<=S.unlocked?'open':'')+(i===level?' cur':'');b.disabled=i>S.unlocked;b.innerHTML=i<=S.unlocked?i+'<br>'+'★'.repeat(S.stars[i]||0):'🔒';b.onclick=()=>start(i);gr.appendChild(b)}m.insertBefore(h,ac);m.insertBefore(gr,ac)}}
function settings(){if(busy&&!back)return;modal('⚙️','ตั้งค่าเกม','',[[(S.sound?'🔊':'🔇')+' เสียงทั้งหมด','secondary',()=>{S.sound=!S.sound;S.sound?music():mStop();save();ui();settings()}],[(S.music?'🎵':'🔕')+' เพลงพื้นหลัง','secondary',()=>{S.music=!S.music;S.music?music():mStop();save();settings()}],['🔁 เริ่มด่านนี้ใหม่','secondary',()=>start(level)],['รีเซ็ตข้อมูลเกม','secondary',()=>modal('⚠️','รีเซ็ตความคืบหน้า?','คะแนน ดาว และด่านที่ปลดล็อกจะถูกลบ',[['ยกเลิก','secondary',settings],['รีเซ็ต','primary',()=>{localStorage.removeItem('candyKingdomSave');S={...D,stars:{},boosters:{...D.boosters}};first=true;start(1)}]])],['ปิด','primary',()=>back?back():(closeM(),idle())]])}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
$('dailyBtn').onclick=()=>{if(S.daily===today()){toast('วันนี้รับรางวัลไปแล้ว 🎁');return}S.daily=today();S.boosters.hammer++;S.boosters.shuffle++;S.coins=(S.coins||0)+30;save();ui();sfx('win');modal('🎁','รับรางวัลสำเร็จ!','ค้อน +1 · สลับกระดาน +1 · เหรียญ +30',[['เยี่ยมเลย!','primary',closeM]])};
$('hammerBtn').onclick=()=>{if(busy)return;if(S.boosters.hammer<=0){toast('ค้อนหมดแล้ว รับรางวัลประจำวันเพื่อเพิ่ม');return}clearSel();setMode(mode?null:'hammer');if(mode)toast('แตะลูกกวาดที่ต้องการทุบ 🔨')};
$('shuffleBtn').onclick=async()=>{if(busy)return;if(S.boosters.shuffle<=0){toast('ไอเทมสลับกระดานหมดแล้ว');return}busy=true;S.boosters.shuffle--;clearSel();setMode(null);await doShuffle();await settle(null);await finish()};
$('hintBtn').onclick=showHint;$('finishBtn').onclick=()=>{if(!busy)win()};$('mapBtn').onclick=showMap;$('setBtn').onclick=settings;
$('soundBtn').onclick=()=>{initAudio();S.sound=!S.sound;S.sound?music():mStop();save();ui()};
$('fsBtn').onclick=()=>{document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.().catch(()=>toast('เบราว์เซอร์ไม่อนุญาตเต็มจอ'))};
document.addEventListener('keydown',e=>{if(e.key==='Escape')[...$('modal').querySelectorAll('button')].find(b=>b.textContent==='ปิด')?.click();if(e.key.toLowerCase()==='h')showHint()});
document.addEventListener('pointerdown',()=>{initAudio();music()},{once:true});
(()=>{const cols=['#e8a05a','#7fb0d8','#f0c58a','#a8c8e8','#d98a5a','#bcd6ec'];let h='';for(let r=0;r<5;r++)for(let c=0;c<16;c++)h+=`<ellipse cx="${c*80+(r%2)*40+rnd(14)}" cy="${655+r*34+rnd(8)}" rx="${34+rnd(10)}" ry="${15+rnd(5)}" fill="${cols[rnd(6)]}" stroke="#fff7" stroke-width="3"/>`;$('cob').innerHTML=h})();
for(let i=0;i<64;i++){cellL.appendChild(document.createElement('div'));iceL.appendChild(document.createElement('div'))}
start(Math.min(S.currentLevel||1,S.unlocked||1));
})();
